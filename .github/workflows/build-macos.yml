name: Build macOS

# Builds the macOS dmg/zip for both architectures on a macOS runner. Same
# trigger as the Windows build so a push to main produces both platforms.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Needed to publish the built files as Release assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The committed .npmrc points at a China mirror that is slow/flaky from
      # GitHub's runners; use the official registry (and default Electron
      # download host) for the CI build instead.
      - name: Use the official npm registry for CI
        run: printf 'registry=https://registry.npmjs.org/\n' > .npmrc

      - name: Install dependencies
        run: npm install

      # Unquoted so the shell expands the glob: `node --test` only expands one
      # itself on Node 21+, and the runner is on 20.
      - name: Run tests
        run: node --test test/*.test.js

      # 邀请码按 secret 处理,但仓库公开、产物发公开 Release,它事实上随包公开;
      # 自助注册出来的客户端默认启用,所以没有准入,只有事后在后台停用。
      - name: Inject the client config
        env:
          REGISTER_CODE: ${{ secrets.REGISTER_CODE }}
        run: |
          if [ -z "$REGISTER_CODE" ]; then
            echo "::error::REGISTER_CODE secret 没设置。继续构建只会产出一个不会自动登录的包,不如直接失败。"
            exit 1
          fi
          node -e 'require("node:fs").writeFileSync("client-config.json", JSON.stringify({apiBase:"https://gen.jh8.ai",registerCode:process.env.REGISTER_CODE}))'

      # 没有开发者证书,ad-hoc 签名即可(和本地 npm run dist 一致)。关掉自动查找
      # 身份,否则 electron-builder 会去翻 runner 的钥匙串、找不到就报错。
      # 收件人首次打开需要:xattr -dr com.apple.quarantine /Applications/老猫.app
      - name: Build macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Publish macOS build to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-${{ github.run_id }}"
          gh release create "$tag" dist/*.dmg dist/*.zip \
            --title "老猫 macOS (build ${{ github.run_number }})" \
            --notes "Automated macOS build from commit ${{ github.sha }}. 首次打开若被拦,执行 xattr -dr com.apple.quarantine /Applications/老猫.app"
